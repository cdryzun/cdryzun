<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 36" width="900" height="36">
  <style>
    .surface { fill: #ffffff; }
    .border { stroke: #d0d7de; }
    .text-muted { fill: #57606a; }
    .text-success { fill: #1a7f37; }

    @media (prefers-color-scheme: dark) {
      .surface { fill: #0d1117; }
      .border { stroke: #30363d; }
      .text-muted { fill: #8b949e; }
      .text-success { fill: #3fb950; }
    }
  </style>

  <rect class="surface" width="900" height="36"/>
  <rect class="text-success" x="0" y="0" width="3" height="36" opacity="0.65"/>
  <line class="border" x1="3" y1="1" x2="900" y2="1" stroke-width="1"/>
  <text class="text-muted" x="450" y="22" font-family="Courier New, monospace" font-size="11.5" text-anchor="middle" letter-spacing="1.5">Zayn’s Blog · ai-native · sre · devops · platform-engineering</text>
